name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "pipelines/baseline.json"
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Unit tests + API tests
        run: python -m pytest tests/ -v --ignore=tests/test_non_regression.py

      - name: Non-regression (skip sans candidat)
        run: python -m pytest tests/test_non_regression.py -v
