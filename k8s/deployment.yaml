apiVersion: apps/v1
kind: Deployment
metadata:
  name: polypcopilot-api
  labels:
    app: polypcopilot-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: polypcopilot-api
  template:
    metadata:
      labels:
        app: polypcopilot-api
    spec:
      containers:
        - name: api
          image: polypcopilot-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
